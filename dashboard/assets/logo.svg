<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Shield Outline -->
  <path d="M50 8 L84 22 C84 56 68 80 50 92 C32 80 16 56 16 22 Z" 
        fill="#0b0f19" 
        stroke="url(#shieldGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />

  <!-- Inner Sentinel Radar / Mine Pickaxe AI Motif -->
  <path d="M50 20 L76 31 C76 58 63 76 50 85 C37 76 24 58 24 31 Z" 
        fill="rgba(0, 242, 254, 0.08)" 
        stroke="rgba(79, 172, 254, 0.4)" 
        stroke-width="1.5" />

  <!-- Central Sentinel AI Eye / Node -->
  <circle cx="50" cy="48" r="14" fill="#0b0f19" stroke="url(#shieldGrad)" stroke-width="3" />
  <circle cx="50" cy="48" r="7" fill="url(#shieldGrad)" filter="url(#glow)" />
  <circle cx="50" cy="48" r="3" fill="#ffffff" />

  <!-- Pulse Rings / Connectivity Nodes -->
  <path d="M50 34 L50 26 M50 62 L50 70 M36 48 L28 48 M64 48 L72 48" 
        stroke="url(#shieldGrad)" 
        stroke-width="2.5" 
        stroke-linecap="round" />
  
  <circle cx="50" cy="24" r="2.5" fill="#00f2fe" />
  <circle cx="50" cy="72" r="2.5" fill="#00f2fe" />
  <circle cx="26" cy="48" r="2.5" fill="#00f2fe" />
  <circle cx="74" cy="48" r="2.5" fill="#00f2fe" />
</svg>
